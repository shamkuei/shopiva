# Shopiva edge proxy (Nginx).
#
# Run behind a TLS terminator (e.g. `certbot --nginx`) or add ssl listen lines.
# The critical line is `proxy_set_header Host $host;` — without it the Next.js
# app sees the upstream name instead of the subdomain and can't route by store.

upstream shopiva_frontend {
	server frontend:3000; # use 127.0.0.1:3000 if the proxy runs on the same host
}

server {
	listen 80;
	# listen 443 ssl;
	server_name yourdomain.com www.yourdomain.com *.yourdomain.com;

	# A reasonable body limit for product image uploads.
	client_max_body_size 10m;

	location / {
		proxy_pass http://shopiva_frontend;
		proxy_http_version 1.1;

		# Preserve the original Host so Next's middleware sees the subdomain.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket / HMR support (Next dev).
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
