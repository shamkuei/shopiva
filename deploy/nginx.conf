# Shopiva production reverse proxy (Nginx).
#
# Route /api/* and /uploads/* to the backend; everything else to the Next.js
# frontend. `proxy_set_header Host $host;` is mandatory so the Next.js middleware
# sees the store subdomain.
#
# TLS: terminate here (add `listen 443 ssl;` + cert paths). Wildcard subdomain
# certs require a DNS-01 challenge — issue one with certbot's DNS plugin, e.g.:
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials ~/.secrets/cf.ini \
#     -d '*.yourdomain.com' -d yourdomain.com
# then reload nginx on renewal.

upstream shopiva_frontend {
	server frontend:3000;
}
upstream shopiva_backend {
	server backend:4000;
}

server {
	listen 80;
	# listen 443 ssl;
	# ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

	server_name yourdomain.com www.yourdomain.com *.yourdomain.com;
	client_max_body_size 10m;

	# Backend API + uploaded images
	location /api/ {
		proxy_pass http://shopiva_backend;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
	location /uploads/ {
		proxy_pass http://shopiva_backend;
		proxy_set_header Host $host;
	}

	# Frontend (storefront + admin)
	location / {
		proxy_pass http://shopiva_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
